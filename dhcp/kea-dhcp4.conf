{
  "Dhcp4": {
    // Interfaz por la que escucha el servidor (la de la red "lan")
    "interfaces-config": {
      "interfaces": [ "eth0" ],
      "dhcp-socket-type": "raw"
    },

    // Base de datos de concesiones (leases) en un archivo CSV
    "lease-database": {
      "type": "memfile",
      "persist": true,
      "name": "/var/lib/kea/dhcp4.leases"
    },

    "valid-lifetime": 3600,  // duración de la concesión: 1 hora
    "renew-timer": 1800,     // T1: el cliente intenta renovar a los 30 min
    "rebind-timer": 3150,    // T2

    // Opciones globales que se entregan a todos los clientes
    "option-data": [
      { "name": "domain-name-servers", "data": "10.10.10.10" },
      { "name": "domain-name",         "data": "redes.lab" },
      { "name": "domain-search",       "data": "redes.lab" }
    ],

    "subnet4": [
      {
        "id": 1,
        "subnet": "10.10.10.0/24",
        // Pool de direcciones que se asignan dinámicamente
        "pools": [ { "pool": "10.10.10.100 - 10.10.10.150" } ],
        "option-data": [
          { "name": "routers", "data": "10.10.10.1" }
        ],
        // Reserva: este equipo siempre recibe la misma IP
        "reservations": [
          { "hw-address": "02:42:0a:0a:00:c8", "ip-address": "10.10.10.200", "hostname": "cliente2" }
        ]
      }
    ],

    "loggers": [
      {
        "name": "kea-dhcp4",
        "output-options": [ { "output": "stdout" } ],
        "severity": "INFO"
      }
    ]
  }
}
