name: redes-lab

# Íconos para OrbStack (icons/). El del proyecto va en todos los servicios.
x-labels: &orbstack-project
  dev.orbstack.compose-icon: https://raw.githubusercontent.com/alanmoyano/redes-actividad-servicios/refs/heads/main/icons/redes-lab.svg

services:
  dns:
    build:
      context: .
      dockerfile: dns/Dockerfile
    cap_add: [NET_ADMIN]
    depends_on: [dhcp]
    container_name: dns
    labels:
      <<: *orbstack-project
      dev.orbstack.icon: https://raw.githubusercontent.com/alanmoyano/redes-actividad-servicios/refs/heads/main/icons/dns.svg
    hostname: dns
    environment:
      DNS_SERVER_DOMAIN: dns.redes.lab
      DNS_SERVER_ADMIN_PASSWORD: ${DNS_ADMIN_PASSWORD:-admin}
      DNS_SERVER_FORWARDERS: 1.1.1.1,8.8.8.8
      DNS_SERVER_RECURSION: AllowOnlyForPrivateNetworks
      DNS_SERVER_WEB_SERVICE_HTTP_PORT: 80 # panel web en http://dns.redes.lab (por defecto es 5380)
    volumes:
      - dns-data:/etc/dns
    ports:
      - "${DNS_PANEL_PORT:-5380}:80"   # panel web también en http://localhost:5380
    networks:
      lan:
        # Docker conserva la misma IP que la reserva DHCP para publicar puertos.
        ipv4_address: 10.10.10.10
        mac_address: "02:42:0a:0a:00:0a"
    restart: unless-stopped

  dhcp:
    build: ./dhcp
    container_name: dhcp
    labels:
      <<: *orbstack-project
      dev.orbstack.icon: https://raw.githubusercontent.com/alanmoyano/redes-actividad-servicios/refs/heads/main/icons/dhcp.svg
    hostname: dhcp
    cap_add: [NET_ADMIN, NET_RAW]
    volumes:
      - ./dhcp/kea-dhcp4.conf:/etc/kea/kea-dhcp4.conf:ro
      - ./dhcp/leases:/var/lib/kea
    networks:
      lan:
        ipv4_address: 10.10.10.11
    restart: unless-stopped

  mail:
    build:
      context: .
      dockerfile: mail/Dockerfile
    cap_add: [NET_ADMIN]
    depends_on: [dhcp]
    container_name: mail
    labels:
      <<: *orbstack-project
      dev.orbstack.icon: https://raw.githubusercontent.com/alanmoyano/redes-actividad-servicios/refs/heads/main/icons/mail.svg
    hostname: mail.redes.lab
    environment:
      OVERRIDE_HOSTNAME: mail.redes.lab
      PERMIT_DOCKER: none
      SSL_TYPE: ""
      ENABLE_CLAMAV: 0
      ENABLE_SPAMASSASSIN: 0
      ENABLE_RSPAMD: 0
      ENABLE_AMAVIS: 0
      ENABLE_FAIL2BAN: 0
      ENABLE_POSTGREY: 0
      ENABLE_OPENDKIM: 0
      ENABLE_OPENDMARC: 0
      ENABLE_POLICYD_SPF: 0
      LOG_LEVEL: info
    volumes:
      - ./mail/config:/tmp/docker-mailserver
      - mail-data:/var/mail
      - mail-state:/var/mail-state
    ports:
      - "${WEBMAIL_PORT:-80}:80"     # webmail en http://localhost
      - "${WEBMAIL_LAN_PORT:-8080}:80"   # webmail para otras computadoras de la LAN: http://<IP-del-host>:8080
    networks:
      lan:
        ipv4_address: 10.10.10.12
        mac_address: "02:42:0a:0a:00:0c"
    restart: unless-stopped

  webmail:
    image: roundcube/roundcubemail:1.7.5-apache@sha256:fea690452cad870440eb231ef2a0c019a46fc5ba5afb069a2edcbf1ce6ab22ab
    container_name: webmail
    labels:
      <<: *orbstack-project
      dev.orbstack.icon: https://raw.githubusercontent.com/alanmoyano/redes-actividad-servicios/refs/heads/main/icons/webmail.svg
    network_mode: service:mail
    environment:
      ROUNDCUBEMAIL_DEFAULT_HOST: localhost
      ROUNDCUBEMAIL_DEFAULT_PORT: 143
      ROUNDCUBEMAIL_SMTP_SERVER: localhost
      ROUNDCUBEMAIL_SMTP_PORT: 587
      ROUNDCUBEMAIL_DB_TYPE: sqlite
      ROUNDCUBEMAIL_SKIN: elastic
      ROUNDCUBEMAIL_PLUGINS: archive,zipdownload,markasjunk
    volumes:
      - ./webmail/config.inc.php:/var/roundcube/config/lab.inc.php:ro
      - webmail-data:/var/roundcube/db
    depends_on: [mail]
    restart: unless-stopped

  cliente1:
    build:
      context: .
      dockerfile: cliente/Dockerfile
    container_name: cliente1
    labels:
      <<: *orbstack-project
      dev.orbstack.icon: https://raw.githubusercontent.com/alanmoyano/redes-actividad-servicios/refs/heads/main/icons/cliente1.svg
    hostname: cliente1
    cap_add: [NET_ADMIN]
    environment:
      MAIL_USER: alumno1@redes.lab
      MAIL_PASS: alumno1
    networks:
      lan:
        # MAC fija (sin reserva)
        mac_address: "02:42:0a:0a:00:64"
    depends_on: [dhcp, dns, mail]
    restart: unless-stopped

  cliente2:
    build:
      context: .
      dockerfile: cliente/Dockerfile
    container_name: cliente2
    labels:
      <<: *orbstack-project
      dev.orbstack.icon: https://raw.githubusercontent.com/alanmoyano/redes-actividad-servicios/refs/heads/main/icons/cliente2.svg
    hostname: cliente2
    cap_add: [NET_ADMIN]
    environment:
      MAIL_USER: alumno2@redes.lab
      MAIL_PASS: alumno2
    networks:
      lan:
        # MAC fija (con reserva)
        mac_address: "02:42:0a:0a:00:c8"
    depends_on: [dhcp, dns, mail]
    restart: unless-stopped

networks:
  lan:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.10.0/24
          ip_range: 10.10.10.32/27
          gateway: 10.10.10.1

volumes:
  dns-data:
    labels:
      dev.orbstack.icon: https://raw.githubusercontent.com/alanmoyano/redes-actividad-servicios/refs/heads/main/icons/dns-data.svg
  mail-data:
    labels:
      dev.orbstack.icon: https://raw.githubusercontent.com/alanmoyano/redes-actividad-servicios/refs/heads/main/icons/mail-data.svg
  mail-state:
    labels:
      dev.orbstack.icon: https://raw.githubusercontent.com/alanmoyano/redes-actividad-servicios/refs/heads/main/icons/mail-state.svg
  webmail-data:
    labels:
      dev.orbstack.icon: https://raw.githubusercontent.com/alanmoyano/redes-actividad-servicios/refs/heads/main/icons/webmail-data.svg
